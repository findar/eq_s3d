<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>eq_s3d Zone Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #ccc; font-family: 'Courier New', monospace; overflow: hidden; }

    #viewport { position: fixed; inset: 0; }

    #sidebar {
      position: fixed; top: 0; right: 0;
      width: 240px; height: 100%;
      background: rgba(0,0,0,0.7);
      border-left: 1px solid #333;
      padding: 16px 12px;
      overflow-y: auto;
      z-index: 10;
    }
    #sidebar h2 { color: #aad4ff; font-size: 13px; letter-spacing: 2px; margin-bottom: 12px; }
    #sidebar h3 { color: #88aacc; font-size: 11px; letter-spacing: 1px; margin: 14px 0 6px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .metric { display: flex; justify-content: space-between; font-size: 11px; margin: 3px 0; }
    .metric-val { color: #8cf; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; cursor: pointer; }
    .toggle-row input { cursor: pointer; }
    #warnings { margin-top: 6px; }
    .warning { font-size: 10px; color: #fa8; margin: 2px 0; }

    #hud {
      position: fixed; bottom: 16px; left: 16px;
      font-size: 11px; color: #666; z-index: 10; line-height: 1.8;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; color: #8cf; font-size: 18px;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="loading">Loading zone…</div>

<canvas id="viewport"></canvas>

<div id="sidebar">
  <h2>⚔ EQ ZONE PREVIEW</h2>

  <h3>Zone Info</h3>
  <div class="metric"><span>File</span><span class="metric-val" id="info-file">—</span></div>
  <div class="metric"><span>Vertices</span><span class="metric-val" id="info-verts">—</span></div>
  <div class="metric"><span>Faces</span><span class="metric-val" id="info-faces">—</span></div>

  <h3>Bounds (EQ units)</h3>
  <div class="metric"><span>Width X</span><span class="metric-val" id="info-wx">—</span></div>
  <div class="metric"><span>Width Y</span><span class="metric-val" id="info-wy">—</span></div>
  <div class="metric"><span>Height Z</span><span class="metric-val" id="info-wz">—</span></div>

  <h3>Overlays</h3>
  <label class="toggle-row"><input type="checkbox" id="tog-wire"> Wireframe</label>
  <label class="toggle-row"><input type="checkbox" id="tog-normals"> Normals</label>
  <label class="toggle-row"><input type="checkbox" id="tog-bbox"> Bounding Box</label>

  <h3>Camera</h3>
  <div class="metric"><span>X</span><span class="metric-val" id="cam-x">—</span></div>
  <div class="metric"><span>Y</span><span class="metric-val" id="cam-y">—</span></div>
  <div class="metric"><span>Z</span><span class="metric-val" id="cam-z">—</span></div>

  <h3>Warnings</h3>
  <div id="warnings"><span style="color:#555;font-size:10px">None</span></div>
</div>

<div id="hud">
  WASD — move &nbsp;|&nbsp; Mouse — look<br>
  Shift — sprint &nbsp;|&nbsp; F — wireframe<br>
  R — reset camera
</div>

<!-- Three.js r165 (single-file, no build step) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';

// ---------------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------------
const canvas   = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth - 240, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 200, 2000);

// Camera — EQ character height ≈ 6 units
const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 240) / window.innerHeight, 0.5, 5000);
camera.position.set(0, 0, 50);

// Lights
const ambient = new THREE.AmbientLight(0x223344, 1.2);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffeedd, 1.5);
sun.position.set(200, 300, 200);
scene.add(sun);

// Axes helper (small, bottom corner)
const axes = new THREE.AxesHelper(20);
axes.position.set(-5, -5, 0);
scene.add(axes);

// ---------------------------------------------------------------------------
// GLB loading
// ---------------------------------------------------------------------------
let currentMesh = null;
let wireframeOverlay = null;
let normalsHelper = null;
let bboxHelper = null;

const loader = new GLTFLoader();

function loadZone() {
  loader.load('/zone.glb',
    (gltf) => {
      if (currentMesh) scene.remove(currentMesh);
      if (wireframeOverlay) scene.remove(wireframeOverlay);

      const model = gltf.scene;

      // Compute bounding box to centre and set camera
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const centre = box.getCenter(new THREE.Vector3());

      // Centre on origin
      model.position.sub(centre);
      scene.add(model);
      currentMesh = model;

      // Place camera at a sensible starting point
      camera.position.set(0, -size.y * 0.4, size.z * 0.3 + 20);
      camera.lookAt(0, 0, 0);
      resetPos.copy(camera.position);

      // Sidebar info
      let totalVerts = 0, totalFaces = 0;
      model.traverse(child => {
        if (child.isMesh && child.geometry) {
          totalVerts += child.geometry.attributes.position.count;
          if (child.geometry.index) totalFaces += child.geometry.index.count / 3;
          else totalFaces += child.geometry.attributes.position.count / 3;
        }
      });
      document.getElementById('info-file').textContent = 'zone.glb';
      document.getElementById('info-verts').textContent = totalVerts.toLocaleString();
      document.getElementById('info-faces').textContent = Math.round(totalFaces).toLocaleString();
      document.getElementById('info-wx').textContent = size.x.toFixed(1);
      document.getElementById('info-wy').textContent = size.y.toFixed(1);
      document.getElementById('info-wz').textContent = size.z.toFixed(1);

      document.getElementById('loading').style.display = 'none';
    },
    undefined,
    (err) => {
      document.getElementById('loading').textContent = 'No GLB loaded yet. Generate a zone first.';
      console.error(err);
    }
  );
}

loadZone();

// ---------------------------------------------------------------------------
// First-person controls (WASD + mouse look)
// ---------------------------------------------------------------------------
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

let yaw = 0, pitch = 0;
let locked = false;
const resetPos = new THREE.Vector3(0, 0, 50);

canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; });
document.addEventListener('mousemove', e => {
  if (!locked) return;
  yaw   -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch  = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
});

const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const move  = new THREE.Vector3();

function updateCamera(dt) {
  // EQ walk speed ≈ 6 units/s, sprint ≈ 20
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 120 : 30;
  euler.set(pitch, yaw, 0);
  camera.quaternion.setFromEuler(euler);

  move.set(0, 0, 0);
  if (keys['KeyW'] || keys['ArrowUp'])    move.z -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  move.z += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  move.x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) move.x += 1;
  if (keys['KeyE'] || keys['Space'])      move.y += 1;
  if (keys['KeyQ'])                       move.y -= 1;

  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed * dt);
    move.applyQuaternion(camera.quaternion);
    camera.position.add(move);
  }

  // R = reset
  if (keys['KeyR']) { camera.position.copy(resetPos); yaw = 0; pitch = 0; }
}

// ---------------------------------------------------------------------------
// Overlays
// ---------------------------------------------------------------------------
document.getElementById('tog-wire').addEventListener('change', e => {
  if (!currentMesh) return;
  if (e.target.checked) {
    const geo = new THREE.BufferGeometry();
    currentMesh.traverse(child => {
      if (child.isMesh) {
        const wm = new THREE.Mesh(
          child.geometry,
          new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true, opacity: 0.3, transparent: true })
        );
        wm.position.copy(child.getWorldPosition(new THREE.Vector3()));
        scene.add(wm);
        wireframeOverlay = wm;
      }
    });
  } else {
    if (wireframeOverlay) { scene.remove(wireframeOverlay); wireframeOverlay = null; }
  }
});

document.getElementById('tog-bbox').addEventListener('change', e => {
  if (!currentMesh) return;
  if (e.target.checked) {
    const box = new THREE.Box3().setFromObject(currentMesh);
    bboxHelper = new THREE.Box3Helper(box, 0xffff00);
    scene.add(bboxHelper);
  } else {
    if (bboxHelper) { scene.remove(bboxHelper); bboxHelper = null; }
  }
});

// F key = wireframe toggle
document.addEventListener('keydown', e => {
  if (e.code === 'KeyF') {
    const cb = document.getElementById('tog-wire');
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  }
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
let last = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - last) / 1000, 0.05);
  last = now;
  updateCamera(dt);

  // Update camera position display
  document.getElementById('cam-x').textContent = camera.position.x.toFixed(1);
  document.getElementById('cam-y').textContent = camera.position.y.toFixed(1);
  document.getElementById('cam-z').textContent = camera.position.z.toFixed(1);

  renderer.render(scene, camera);
}
animate();

// ---------------------------------------------------------------------------
// Auto-reload when GLB changes
// ---------------------------------------------------------------------------
let lastMtime = 0;
async function pollReload() {
  try {
    const r = await fetch('/status');
    const d = await r.json();
    if (d.mtime > lastMtime) {
      lastMtime = d.mtime;
      if (lastMtime > 0) {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('loading').textContent = 'Reloading…';
        loadZone();
      }
    }
  } catch {}
  setTimeout(pollReload, 2000);
}
pollReload();

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth - 240;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
