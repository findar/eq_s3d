# rules/walls/rough.toml -- a natural cave.
#
# Measured on Blackburrow, Splitpaw, Crystal Caverns, Runnyeye, Solusek's Eye and
# Nagafen's Lair, and Permafrost (design finding 1). Their walls stand plumb over
# an irregular plan, runs of 17-31 u between bends; only 37-57% of the wall area
# lies on the zone's grid. Floors roll a little, ceilings a lot.
# The guide is docs/TOPOLOGY_RULES.md, "Wall styles".

[style]
name = "rough"
description = "A natural cave: Voronoi Cells, walls that wander, a moving ceiling."
finish = [0, 3]          # rooms that draw this finish take this style
complex = "voronoi"
cell_size_h = 4.0
wobble_h = 1.3            # stock walls keep to no straight side; a Box's would show
fill = [0.70, 0.85]
floor_relief_h = [0.0, 0.9]
ceiling_spread = [0.1, 0.6]
corridor_break = 0.15

[shapes]
default = { blob = 2, ell = 1 }
entrance = { blob = 1 }
hall = { long = 3, blob = 1 }
hub = { cross = 2, blob = 1 }
lair = { blob = 2, ell = 1 }
deep = { blob = 1 }

[look]
wall = "rock"
floor = "rock"
ceiling = "rock"

# How the numbers move across the band: a factor at its low end, one at its high end. The
# middle is the style as written above.
[tune]
wobble_h = [1.25, 0.75]
floor_relief_h = [1.2, 0.8]
ceiling_spread = [1.2, 0.8]
corridor_break = [1.2, 0.8]

# How a corridor's plain legs wind (step 23). From the stock tunnel survey
# (scripts/tunnel_survey.py), the plain tunnels' numbers: a run between turns (u, along
# the leg), the most a turn bends (degrees), the most the centreline strays over the
# leg's span, and how far each end runs straight (u). Only one style may have a [tunnel].
[tunnel]
segment = [20, 72]
max_turn = 60
wander = 0.2
end = 20
