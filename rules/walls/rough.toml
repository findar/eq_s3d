# rules/walls/rough.toml -- a natural cave.
#
# Measured on Blackburrow, Splitpaw, Crystal Caverns, Runnyeye, Solusek's Eye and
# Nagafen's Lair, and Permafrost (design finding 1). Their walls stand plumb over
# an irregular plan, runs of 17-31 u between bends; only 37-57% of the wall area
# lies on the zone's grid. Floors roll a little, ceilings a lot.
# The guide is docs/TOPOLOGY_RULES.md, "Wall styles".

[style]
name = "rough"
description = "A natural cave: Voronoi Cells, walls that wander, a moving ceiling."
complex = "voronoi"
cell_size_h = 4.0
wobble_h = 1.3            # stock walls keep to no straight side; a Box's would show
fill = [0.70, 0.85]
floor_relief_h = [0.0, 0.9]
ceiling_spread = [0.1, 0.6]
corridor_break = 0.15

[shapes]
default = { blob = 2, ell = 1 }
entrance = { blob = 1 }
hall = { long = 3, blob = 1 }
hub = { cross = 2, blob = 1 }
lair = { blob = 2, ell = 1 }
deep = { blob = 1 }

[look]
wall = "rock"
floor = "rock"
ceiling = "rock"
