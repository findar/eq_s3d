# --- what happened to it since -------------------------------------------------------------------

[overlays.natural_cave]  # an outdoor dungeon with no theme: the Blackburrow it's modelled on
finish = { peak = 1, spread = 2 }

[overlays.reclaimed]     # a tidier race took it over: the walls stay, the mess goes
clutter = { peak = 1, spread = 1, override = true }
structure = { peak = 6, spread = 2 }

[overlays.ruined]        # long abandoned, and falling in
finish = { peak = 3, spread = 4 }
structure = { peak = 2, spread = 2 }
clutter = { peak = 8, spread = 2, override = true }

[overlays.fresh_dig]     # recently excavated: raw walls, loose rock everywhere
finish = { peak = 3, spread = 2 }
structure = { peak = 2, spread = 2 }
clutter = { peak = 8, spread = 2, override = true }

# --- wings, named by topology rules (`wing = "cave"` on a node); what it grows into inherits ---
# Rooms lean only within their wing, so a wing's edge stays hard (design finding 3).

# A wing's finish is written out: its edge is hard, and only a written 0 rules a value out.
[wings.cave]
finish = { weights = [0.67, 1, 0.67, 0.33, 0, 0, 0, 0, 0, 0, 0], override = true }
clutter = { peak = 5, spread = 3 }

[wings.masonry]
finish = { weights = [0, 0, 0, 0, 0, 0, 0, 0, 0.5, 1, 0.5], override = true }
clutter = { peak = 2, spread = 2 }

[wings.old_mine]
finish = { weights = [0, 0, 0, 0.5, 1, 0.5, 0, 0, 0, 0, 0], override = true }
structure = { peak = 3, spread = 2 }
clutter = { peak = 7, spread = 2, override = true }

