# rules/rooms/scales.toml -- what a room is like (roadmap step 9).
#
# Three scales from 0 to 10:
#   finish     raw rock to dressed stone: 0-3 draws a rough room, 4-6 hewn, 7-10 built
#   structure  how much is built into it: pillars, plinths, daises (5 = the recipe as written)
#   clutter    how much lies about: boulders now, loose objects in step 11
#
# Weights are eleven numbers, one per value, and a value's chance is its weight over the sum:
#   finish = [1, 1, 1, 1, 1, 1, 1, 2, 3, 3, 2]
# or a shorthand, a bell 1 at the peak and low just past the spread either side, never quite 0:
#   finish = { peak = 8, spread = 2 }
# Write the eleven numbers when a value must be impossible: only a written 0 is.
#
# A room multiplies its layers: default, race, theme, overlay, kind, type, wing. So an ogre temple is a
# blend, and bells meet between their peaks. `override = true` replaces everything less specific, and
# if written zeros leave every value at 0, the most specific layer decides.
#
# Stock zones rarely hold to one finish (design finding 3): their neighbours mostly agree, and
# 0-41% of them break. So the default is wide, and coherence, how strongly a room leans toward
# its neighbours, is modest: a smooth lean can't make a wing's hard edge, and rules do that.
# Only coherence's finish comes from measuring. The rest is a first judgement, for the looks.
# The guide is docs/TOPOLOGY_RULES.md, "Scales".

[default]
finish = [2, 2, 2, 2, 1, 1, 1, 1, 2, 2, 2]
structure = { peak = 5, spread = 3 }
clutter = { peak = 3, spread = 3 }
coherence = { finish = 4, structure = 3, clutter = 3 }

