# rules/sites/inhabitants.toml -- who built a Site (roadmap step 10, Req 5).
#
# [inhabitants.<name>]
#   materials  the material set its Structures are textured with
#   variants   Structure -> model variant, where this Inhabitant's differs (a hide tent, not canvas)
#   swap       Structure -> Structure it builds instead (centaurs build lean-tos, not tents)
#   weights    Site kind -> weight. A kind it doesn't name it leaves alone (weight 1); 0 is never.
#
# A Site's kind is drawn from its Layers multiplied: biome x Inhabitant x control, as the room
# Scales are (rules/rooms/scales.toml); a kind's chance is its weight over the sum.
#
# Archive decision 4: human, orc, gnoll, centaur, the Karanas' own. Others come with their biomes.
#
# The weights read design finding 1: Karana farms are human, South Karana's lean-tos and burial
# mounds centaur, South Ro's tents orc. Real towers are rare in stock (21 placed in all, none on
# the plains: DTOW and BTOW are rock spires), so every Inhabitant's watchtower weight is small.
#
# Material sets are generators/textures/sites.py's MATERIAL_SETS (task 4).

[inhabitants.human]
materials = "timber_thatch"
variants = { tent = "canvas", hut = "timber", barn = "timber", fence = "rail", tower = "timber" }
weights = { camp = 1, hut = 3, farmstead = 3, watchtower = 0.5, shrine = 0.5, ruin = 1 }

[inhabitants.orc]
materials = "hide"
variants = { tent = "hide", tower = "lashed", fence = "stake" }
weights = { camp = 4, hut = 0, farmstead = 0, watchtower = 0.5, shrine = 0.5, ruin = 1 }

[inhabitants.gnoll]
materials = "crude_timber"
variants = { tent = "hide", hut = "wattle", fence = "stake" }
weights = { camp = 3, hut = 1, farmstead = 0, watchtower = 0.25, shrine = 1, ruin = 1 }

[inhabitants.centaur]
materials = "hide_canvas"
variants = { lean_to = "hide", monument = "burial_mound" }
swap = { tent = "lean_to" }
weights = { camp = 3, hut = 0, farmstead = 0, watchtower = 0, shrine = 3, ruin = 0.5 }
