# rules/sites/sites.toml -- what a Site is (roadmap step 10, Req 5).
#
# Two tables:
#   [structures.<name>]  each Structure model a Site is built from. The names are the models
#                        generators/sites/models.py builds (site_<name>.mod); a new name needs a model.
#   [kinds.<name>]       each Site kind's recipe: its Structures, how they stand, the ground it
#                        needs and likes, and its POIs. A new kind needs no code.
#
# A recipe:
#   arrangement  how the Structures stand: ring, row, cluster, lone or perimeter. A line's `at`
#                defaults to it; `at = "centre"` stands a line at the Site's middle.
#   structures   lines: { kind, count, at, face, side, chance }
#                  count   a number or [low, high], 0 to 12
#                  face    where an opening looks: in (toward the centre), out, or any
#                  side    "open": on the Site's open side, away from the rest (a farm's corral)
#                  chance  how likely the line is at all, 0 to 1
#   ground       radius (u, the Site's own ground), slope_deg (the steepest ground it stands on),
#                spacing (u, the least distance to any other Site's centre), margin (u, the
#                Site_Clear round its edge)
#   likes        what scores a candidate centre, 0 to 10 each: near_water, high_ground,
#                low_ground, by_zoneline, clearing
#   pois         at least one: { name, purpose, at }. `at` is a Structure in this recipe, "centre"
#                or "entrance". purpose is one of Light_Spot, interior, altar, lookout, gathering,
#                guard, treasure; an interior stands in an Enterable Structure.
#
# Where the numbers come from (design finding 1, task 1's survey of 21 Classic outdoor zones,
# scripts/site_survey.py): Structure sizes are the generated models' own (generators/sites/
# models.py, the largest over every variant and seed); a Site's radius sits in the survey's band
# (zone p50 0-45 u, p90 35-120 u; plains p50 0-93 u); slopes under the survey's p50 (under 8
# degrees in every zone, plains 0-7.8); spacing in its band (zone p10 130-490 u over all zones,
# 108-190 u on the plains; the closest pair anywhere 108 u); counts from Structures per Site
# (zone p50 1-3, p90 2-10 on the plains; 51% of Sites are one Structure, 44% 2-5, 5% 6+).
# Stock Sites are not drawn to water or zonelines (both 1000 u or more away at the median), so
# no recipe likes them.
#
# The guide to checking and drawing these files: python scripts/topology_rules.py check rules/sites
# and python scripts/topology_rules.py draw-sites --out output/rules/

# --- Structures --------------------------------------------------------------------------------
# radius: the model's plan reach from its origin (u); height: its top (u). Both are the largest
# over every variant and seed of generators/sites/models.py, rounded up. Fence and ruin_wall are
# runs: their radius is the run's half-length (generators/sites/models.RUN_HALF_LENGTH), the run
# laid across its yaw, 1 u thick each side (generators/sites/placement.py).
# enterable: a player walks into it, floored by the ground (archive decision 2: huts, lean-tos,
# ruins; towers are solid).

[structures.hut]
radius = 23
height = 31
enterable = true

[structures.barn]
radius = 38
height = 52
enterable = false

[structures.tent]
radius = 14
height = 23
enterable = false

[structures.lean_to]
radius = 14
height = 18
enterable = true

[structures.tower]
radius = 18
height = 69
enterable = false

[structures.fire_ring]
radius = 5.5
height = 3
enterable = false

[structures.fence]
radius = 10          # a run's half-length
height = 13
enterable = false

[structures.standing_stone]
radius = 3
height = 15
enterable = false

[structures.altar_stone]
radius = 5
height = 5
enterable = false

[structures.monument]
radius = 14.5        # the burial mound's; the obelisk's is 6
height = 27
enterable = false

[structures.ruin_wall]
radius = 10          # a run's half-length
height = 13.5
enterable = true     # the ruin's court, inside its broken ring, is walked into

# --- Kinds -------------------------------------------------------------------------------------

# A fire with tents or lean-tos round it, openings in: the commonest stock Site (finding 1:
# CAMPFIRE with ORCTENT, BTENT, GOBTENT, CENLEANTO in nearly every zone).
[kinds.camp]
arrangement = "ring"
structures = [
    { kind = "fire_ring", at = "centre" },
    { kind = "tent", count = [2, 4], face = "in" },        # 3-5 Structures (SRO, Oasis zone p50 3)
]
ground = { radius = 46, slope_deg = 8, spacing = 200, margin = 8 }      # tents ring the fire 32 u out (SRO 37, Oasis 42)
likes = { clearing = 1 }
pois = [
    { name = "camp fire", purpose = "Light_Spot", at = "fire_ring" },
    { name = "camp", purpose = "gathering", at = "centre" },
]

# One Enterable hut, sometimes a fence run beside it (finding 1: SHAK, HOUSE1).
[kinds.hut]
arrangement = "lone"
structures = [
    { kind = "hut", at = "centre", face = "any" },
    { kind = "fence", count = [0, 2], at = "row", side = "open", chance = 0.2 },   # mostly a lone Site (SHAK, HUT1)
]
ground = { radius = 40, slope_deg = 6, spacing = 200, margin = 8 }      # the hut and a fence run
likes = { clearing = 2 }
pois = [
    { name = "hut interior", purpose = "interior", at = "hut" },
]

# House, barn and a corral on the open side: the Karanas' signature (finding 1: BARN1, RHOUSE1,
# HOUSE1, CORRALL).
[kinds.farmstead]
arrangement = "cluster"
structures = [
    { kind = "hut", face = "any" },
    { kind = "barn", face = "any" },                       # BARN1 x4 to RHOUSE1 x3: one a farm
    { kind = "fence", count = [3, 4], at = "row", side = "open" },        # the corral (CORRALL 46x43): 5-6 Structures
]
ground = { radius = 72, slope_deg = 5, spacing = 300, margin = 10 }     # house, barn and corral within 100 u of each other (the survey's gap)
likes = { low_ground = 3 }
pois = [
    { name = "farmhouse interior", purpose = "interior", at = "hut" },
    { name = "yard", purpose = "gathering", at = "centre" },
]

# One or two solid towers on high ground, looking at a way in (finding 1: DTOW, BTOW, MTOWER).
[kinds.watchtower]
arrangement = "lone"
structures = [
    { kind = "tower", count = [1, 2] },        # two stand as a pair (EKTOWER, ELFTOWER, MTOWER)
]
ground = { radius = 40, slope_deg = 10, spacing = 400, margin = 8 }     # a pair 40-50 u apart
likes = { high_ground = 4 }
pois = [
    { name = "lookout", purpose = "lookout", at = "tower" },
    { name = "tower guard", purpose = "guard", at = "entrance" },
]

# Standing stones round an altar stone (finding 1: BURIAL, DWMONU, MONU4, MCIRCLE).
[kinds.shrine]
arrangement = "ring"
structures = [
    { kind = "altar_stone", at = "centre" },
    { kind = "standing_stone", count = [3, 6], face = "in" },     # MCIRCLE, MONU4 x4 in Oasis
    { kind = "monument", count = [0, 1], at = "lone", chance = 0.3 },
]
ground = { radius = 30, slope_deg = 8, spacing = 300, margin = 8 }      # room for a burial mound
likes = { high_ground = 3, clearing = 2 }
pois = [
    { name = "shrine altar", purpose = "altar", at = "altar_stone" },
]

# Broken wall runs round a court, with gaps for the way in. Stock ruins are mostly in the terrain
# mesh (finding 1 can't see them), so this kind's numbers are the least grounded.
[kinds.ruin]
arrangement = "perimeter"
structures = [
    { kind = "ruin_wall", count = [3, 5], face = "in" },          # COMRUIN 46x35: a court ~40 u
    { kind = "standing_stone", count = [0, 2], at = "cluster", chance = 0.4 },
]
ground = { radius = 32, slope_deg = 10, spacing = 300, margin = 8 }
likes = { high_ground = 1, clearing = 1 }
pois = [
    { name = "ruin court", purpose = "interior", at = "ruin_wall" },
    { name = "buried cache", purpose = "treasure", at = "centre" },
]
