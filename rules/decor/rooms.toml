bare = 0.5

# --- Groups ------------------------------------------------------------------------------------
# Placed together, whole or not at all. The first member is the anchor; the rest stand round it,
# in a row with it, beside it, or on it (`stack`, a raised Mount).

[groups.table_set]              # finding 1: 1.1-2.7 chairs to a seated table
members = [ { kind = ["table", "desk"], at = "anchor" },
            { kind = ["chair", "stool", "bench"], at = "round", count = [1, 3] },
            { kind = ["candle", "tableware", "book"], at = "stack", count = [0, 2] } ]

[groups.laid_table]             # a dungeon's table, something left on it
members = [ { kind = ["table", "desk"], at = "anchor" },
            { kind = ["chair", "stool", "bench"], at = "round", count = [1, 3] },
            { kind = ["candle", "tableware", "book"], at = "stack", count = [1, 2] } ]

[groups.crate_stack]            # one crate on another (finding 1: about 5% of Props are raised)
members = [ { kind = ["crate", "box"], at = "anchor" },
            { kind = ["crate", "box"], at = "stack" } ]

[groups.bunks]                  # beds in rows in the barracks dungeons
members = [ { kind = "bed", at = "anchor" },
            { kind = "bed", at = "row", count = [1, 3] } ]

[groups.crate_pile]
members = [ { kind = ["crate", "box"], at = "anchor" },
            { kind = ["crate", "barrel", "box"], at = "beside", count = [1, 2] },
            { kind = ["crate", "box"], at = "stack", count = [0, 1] } ]

[groups.forge_set]
members = [ { kind = "forge", at = "anchor" },
            { kind = "anvil", at = "beside" },
            { kind = ["barrel", "bucket"], at = "beside", count = [0, 1] } ]

[groups.reading_desk]
members = [ { kind = ["desk", "table"], at = "anchor" },
            { kind = ["chair", "stool"], at = "beside" },
            { kind = ["book", "candle"], at = "stack", count = [0, 2] } ]

# --- every room, after its own recipe: the backbone and the mess -----------------------------------

[every]
props = [ { kind = ["torch", "lantern", "lamp"], at = "on_wall", count = [1, 3] },
          { kind = ["brazier", "tiki"], at = "corners", count = [1, 2], chance = 0.1 },
          { kind = ["rock", "bones", "bone_pile"], at = "scatter", count = [1, 3] },
          { kind = ["web", "mushroom", "skull"], at = "corners", count = [1, 2], chance = 0.3, from = 5 },
          { kind = ["chain", "hook"], at = "ceiling", count = [1, 2], chance = 0.08 },
          { kind = ["bones", "bone_pile", "skull"], at = "scatter", count = [1, 2], chance = 0.4 } ]

# --- the default and kinds, for rooms with no room type (a plain dungeon) -------------------------

[default]
props = [ { kind = ["barrel", "crate", "box"], at = "along_wall", count = [1, 2], chance = 0.3 },
          { group = "table_set", at = "centre", chance = 0.25 },
          { kind = ["bench", "stool"], at = "along_wall", count = [1, 2], chance = 0.15 } ]

