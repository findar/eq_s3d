# rules/decor/rooms.toml -- what furnishes a room (roadmap step 11).
#
# A room takes its room type's recipe, else its kind's, else the default, then the `every` lines.
# A Site takes its Site kind's recipe (`[sites.<kind>]`, task 11) and no `every` lines. POIs take
# their Dressing first. Each line asks for Props by Tag: a catalogue kind (or a list of kinds,
# best first) or a Group of them, and only models with `use = "yes"` fill it (tags.toml).
#
#   kind     a kind of generators/decor/catalogue.py KINDS, or ["throne", "chair"]: best first
#   group    a Group below, placed whole or not at all, instead of a kind
#   at       where it stands, which sets the Mount it asks for:
#              on_wall (wall), ceiling (ceiling); along_wall (back to a wall), corners, centre,
#              far_end, scatter, rows, by_door, on_dais (floor)
#            and for Dressing, round its POI: beside, behind, flank, round (floor); wall (the
#            wall nearest the POI). A light line on_wall or at corners is placed as one
#            symmetric set (task 22): pairs straight across the room or evenly along a wall;
#            two opposite corners or all four (an odd corner count rounds up or down by chance)
#   count    how many: a number or [low, high]
#   chance   how likely this line is at all
#   by       the Scale that moves this line (scales.toml): finish, structure or clutter. Left out,
#            a line takes its Category's from `moves`. 5 is the line as written, 0 nothing, 10
#            twice as much
#   from     the line is there only from this value of its Scale up
#
# Design finding 1 sets the figures: a stock dungeon room holds about 4 Props (zone p25-p75 of
# 2.9-6.8 a room), about a quarter hold none; a third are lights, three quarters of those on
# walls; nearly a third debris; 14% furniture and 8% containers. A city room holds about 9:
# 39% lights, 28% furniture, 12% containers, almost no debris. `python scripts/topology_rules.py
# draw-decor` shows what each recipe gives, by zone type, race and theme, and `check rules/decor`
# names every line no `use = "yes"` model meets yet (such a line drops at build time).

# Clutter moves debris; Structure moves furniture lines (design "Decor recipes as data").
moves = { debris = "clutter", furniture = "structure" }

# Kinds a room holds at most once (task 22): a line, a Group member or a Dressing asking for one
# again takes its next kind, or drops. `decor_survey.py --layout` lists the kinds the stock rooms
# hold once: in 4 rooms or more, at most a tenth of them holding two (anvil, box, cart, desk, fire).
# The forge is the user's (acceptance pass, task 16: "a forge i would usually only expect a single
# one in a room"); stock puts two in 2 of its 4 forge rooms (Ak'Anon's smithy, Upper Guk's pair).
once = ["anvil", "box", "cart", "desk", "fire", "forge"]

# --- Weights by Layer -----------------------------------------------------------------------
#
# Each is a multiplier on the recipes' counts, by Category (light, container, furniture,
# hanging, structure, debris, plant, other). A room's Layers are default, zone type, race,
# theme, room kind, room type; its weight is the geometric mean of the Layers that name the
# Category, as step 9's Scales blend (so 4 next to the default's 1 gives 2: write the number
# you'd want alone, squared). `{ value = 3, override = true }` replaces every less specific
# Layer. `bare` is the chance a room takes only its Dressing. The Decor control multiplies on top.

[weights.default]
light = 1
container = 1
furniture = 1
hanging = 1
structure = 1
debris = 1
plant = 1
other = 1
bare = 0.26

[weights.controls.none]
light = 0
container = 0
furniture = 0
hanging = 0
structure = 0
debris = 0
plant = 0
other = 0

[weights.controls.sparse]
light = 0.6
container = 0.5
furniture = 0.5
hanging = 0.5
structure = 0.5
debris = 0.4
plant = 0.5
other = 0.5

[weights.controls.normal]

[weights.controls.dense]
light = 1.4
container = 1.8
furniture = 1.8
hanging = 1.8
structure = 1.8
debris = 2
plant = 1.8
other = 1.8

# Cities: more furniture and lights, almost no debris (finding 1). Written as the city's own,
# not blended with the dungeon default.
[weights.zone_types.city]
light = { value = 1.1, override = true }
container = { value = 2.8, override = true }
furniture = { value = 2.2, override = true }
debris = { value = 0.15, override = true }
plant = { value = 1.15, override = true }
bare = { value = 0.2, override = true }

# A natural cave: fewer lights, more lying about.
[weights.zone_types.outdoor_dungeon]
light = 0.6
debris = 1.7
furniture = 0.5
bare = 0.3

